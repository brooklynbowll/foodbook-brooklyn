<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FOODBOOK Бруклина</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: phone-first stack — sticky lane bar on top, category shelf, then dish "menu cards" read one after another */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1b1a17; --ink2:#5d5a52; --mute:#8e8a80; --line:#e3dfd5;
  --accent:#c8261d; --accent-ink:#ffffff; --accent-soft:#f8e3e0; --lane:#e9dcc4; --ok:#2f7d4f; --ok-soft:#dff0e5;
  --shade:rgba(20,18,15,.92);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141414; --surface:#1e1d1b; --ink:#f2efe8; --ink2:#bdb8ad; --mute:#8b867c; --line:#2f2d29;
  --accent:#ff5a4c; --accent-ink:#1a0d0b; --accent-soft:#3a1d1a; --lane:#3a3127; --ok:#5cc98a; --ok-soft:#183324; --shade:rgba(0,0,0,.94); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1e1d1b; --ink:#f2efe8; --ink2:#bdb8ad; --mute:#8b867c; --line:#2f2d29;
  --accent:#ff5a4c; --accent-ink:#1a0d0b; --accent-soft:#3a1d1a; --lane:#3a3127; --ok:#5cc98a; --ok-soft:#183324; --shade:rgba(0,0,0,.94); color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px;min-height:56px}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.back svg{width:20px;height:20px}
.bar h1{font-family:var(--f-display);font-weight:800;font-size:17px;margin:0;line-height:1.15;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .count{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:10px;scrollbar-width:none;max-width:760px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:4px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;color:var(--ink2)}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* home */
.hero{padding-block:22px 6px}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,44px);line-height:1.02;margin:8px 0 10px;text-wrap:balance;letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink2);max-width:60ch}
.progress{display:flex;align-items:center;gap:12px;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.progress .track{flex:1;height:10px;border-radius:4px;background:var(--lane);overflow:hidden}
.progress .fill{height:100%;background:var(--ok);border-radius:4px;transition:width .3s}
.progress b{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.search{margin-top:14px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:13px 14px 13px 42px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute)}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:26px 0 10px}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:1/1;max-width:100%;background:#2a2826;text-align:left;display:block;width:100%}
.cat img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.cat:hover img{transform:scale(1.04)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.78))}
.cat .lbl{position:absolute;left:12px;right:12px;bottom:11px;z-index:1;color:#fff}
.cat .lbl b{display:block;font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.15;text-wrap:balance}
.cat .lbl span{font-size:12.5px;opacity:.85;font-variant-numeric:tabular-nums}
.cat .done{position:absolute;top:10px;right:10px;z-index:1;background:var(--ok);color:#fff;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:4px}
.extra{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.xcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.xcard b{font-weight:700;font-size:15px}
.xcard span{font-size:13px;color:var(--ink2)}
.results{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:left;width:100%}
.row img,.row .noimg{width:64px;height:48px;border-radius:4px;object-fit:cover;flex:none;background:var(--lane)}
.row div{min-width:0}
.row b{display:block;font-size:15px;line-height:1.2}
.row span{font-size:12.5px;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;padding:12px 2px}

/* category */
.cat-tools{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:4px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}
.note{font-size:14px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:12px}
.dishes{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;scroll-margin-top:130px}
.ph{display:block;width:100%;aspect-ratio:765/538;max-width:100%;background:#2a2826;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .zoom{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.ph .zoom svg{width:17px;height:17px}
.ph.none{display:grid;place-items:center;color:var(--mute);background:var(--lane);font-size:14px;aspect-ratio:3/1}
.dbody{padding:16px 16px 14px;display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.dhead h3{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.18;margin:0;text-wrap:balance;min-width:0}
.learn{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:7px 11px;border-radius:4px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.learn[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.learn svg{width:15px;height:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.chip.n{background:var(--lane);color:var(--ink)}
.lab{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.sost{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.sost li{font-size:14px;padding:4px 10px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.say{margin:0;font-size:15.5px;line-height:1.5;color:var(--ink);border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.rec dt{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding-top:2px}
.rec dd{margin:0;color:var(--ink2)}

/* reference */
.ref{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ref div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.ref b{display:block;font-size:15px;margin-bottom:2px}
.ref span{font-size:14px;color:var(--ink2)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));color:#fff}
.lb-top b{font-family:var(--f-display);font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-x{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;flex:none}
.lb-x svg{width:20px;height:20px}
.lb-img{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain}
.lb-cap{color:#d9d5cc;font-size:13.5px;padding:8px max(16px,env(safe-area-inset-left,0px)) 14px;text-align:center}

/* quiz */
.quiz{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.quiz .q-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.quiz .q-ask{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0}
.quiz .q-meta{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.q-actions{display:flex;gap:8px;flex-wrap:wrap}
.q-actions .btn{flex:1;justify-content:center;min-width:130px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v2: category picker, dish strip, ingredient quiz */
:root{--scrim:rgba(20,18,15,.45)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--scrim:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--scrim:rgba(0,0,0,.6)}
.picker{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:6px;background:var(--surface);border:1px solid var(--line);text-align:left}
.picker span{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.picker svg{width:18px;height:18px;flex:none;color:var(--mute);transition:transform .2s}
.picker[aria-expanded="true"] svg{transform:rotate(180deg)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:10px;scroll-behavior:smooth}
.strip::-webkit-scrollbar{display:none}
.sd{flex:none;max-width:72vw;padding:7px 12px;border-radius:4px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px}
.sd i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.sd[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 64px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:6px;width:100%;max-width:520px;max-height:72vh;overflow:auto;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px;border-radius:6px;text-align:left}
.mi img{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none}
.mi b{flex:1;min-width:0;font-size:16px;font-weight:600}
.mi span{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.mi[aria-current="true"]{background:var(--accent-soft)}
.mi[aria-current="true"] b{color:var(--accent)}
.dish{scroll-margin-top:0}
.passed{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:4px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.passed svg{width:14px;height:14px}
.cta{display:flex;align-items:center;gap:14px;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:16px 18px;text-align:left;margin-top:14px}
.cta .ic{width:44px;height:44px;border-radius:6px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.cta .ic svg{width:22px;height:22px}
.cta div{flex:1;min-width:0}
.cta b{display:block;font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.15}
.cta span{font-size:13.5px;opacity:.85}
.cta>svg{width:22px;height:22px;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 13px;border-radius:4px;border:1.5px solid var(--line);background:var(--bg);font-size:15px;font-weight:500;line-height:1.2;text-align:left}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.opt.miss{background:transparent;color:var(--ok);border-color:var(--ok);border-style:dashed}
.opt.wrong{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);text-decoration:line-through}
.opt.off{opacity:.45}
.opts.done .opt{cursor:default}
.verdict{border-radius:6px;padding:12px 14px;font-size:15px;line-height:1.4}
.verdict b{display:block;font-size:16px;margin-bottom:2px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.q-score{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}

/* v3: header stays fixed, content scrolls in its own pane */
html,body{height:100%}
body{overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#app>.bar{position:relative;top:auto;flex:none}
#app>.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}

/* v4: report an error in the quiz */
.quiz.flag{outline:3px solid var(--accent);outline-offset:3px;animation:flagPulse 1.1s ease 2}
@keyframes flagPulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 10px var(--accent-soft)}}
.rep-banner{background:var(--accent);color:var(--accent-ink);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.rep-banner>svg{width:26px;height:26px;flex:none;margin-top:1px}
.rep-banner div{min-width:0;display:flex;flex-direction:column;gap:4px}
.rep-banner b{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.2}
.rep-banner span{font-size:13.5px;line-height:1.35;opacity:.95}

.rep-note{background:var(--surface);color:var(--ink);border-radius:6px;padding:10px 12px;margin-top:4px}
.rep-lab{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);opacity:1!important;margin-bottom:3px}
.rep-note p{margin:0;font-size:15px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.rep-edit{align-self:flex-start;font-size:13px;font-weight:600;text-decoration:underline;color:inherit;opacity:.9;margin-top:2px}

.modal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.dlg{background:var(--surface);border:3px solid var(--accent);border-radius:6px;width:100%;max-width:440px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.dlg-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dlg-kick{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.dlg-kick svg{width:15px;height:15px}
.dlg-x{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.dlg-x svg{width:18px;height:18px}
.dlg-big{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.18;text-transform:uppercase;color:var(--accent);letter-spacing:.01em;text-wrap:balance}
.dlg-dish{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.dlg-dish img{width:60px;height:60px;border-radius:6px;object-fit:cover;flex:none}
.dlg-dish div{min-width:0;display:flex;flex-direction:column}
.dlg-dish span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.dlg-dish b{font-size:17px;line-height:1.2}
.dlg-dish small{font-size:13px;color:var(--ink2)}
.dlg-lab{font-size:15px;font-weight:700}
.dlg textarea{font:inherit;font-size:16px;line-height:1.4;width:100%;resize:vertical;min-height:104px;padding:10px 12px;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-top:-6px}
.dlg textarea:focus{outline:none;border-color:var(--accent)}

.report{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:6px;border:1.5px dashed var(--line);color:var(--ink2);font-size:14.5px;font-weight:600}
.report svg{width:17px;height:17px;flex:none}

/* v5: run through a category, results */
.runbar{height:4px;background:var(--lane);flex:none}
.runbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.intro-n{display:flex;align-items:baseline;gap:10px}
.intro-n b{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.intro-n span{font-size:15px;color:var(--ink2);font-weight:600}

const catsOf = sec => DATA.cats.map((c,i)=>i).filter(i=>DATA.cats[i].sec===sec);
const totalOf = sec => catsOf(sec).reduce((a,i)=>a+DATA.cats[i].dishes.length,0);
const coverOf = c => c.dishes.find(d=>d.img!=null);
const coverImg = c => { const d=coverOf(c); return d?`<img src="${img(d.img)}" alt="" loading="lazy">`:`<span class="ncover" aria-hidden="true">${esc(c.name.slice(0,1))}</span>`; };
const thumbOf = d => d.img!=null?`<img src="${img(d.img)}" alt="" loading="lazy">`:'<span class="noimg"></span>';
/* quiz uses only real ingredients: anything that is itself a dish name is left out */
const wordsOf = s => s.toLowerCase().replace(/ё/g,'е').replace(/[«»"“”().,\-]/g,' ').split(/\s+/).filter(Boolean);
const DISHW = DATA.cats.filter(c=>c.sec==='k').flatMap(c=>c.dishes.map(d=>new Set(wordsOf(d.name))));
const isDishName = s => { const w=wordsOf(s); if(!w.length) return false;
  return DISHW.some(ds=>{ if(!w.every(x=>ds.has(x))) return false; const extra=[...ds].filter(x=>!w.includes(x));
    if(!extra.length) return true;                                   /* то же название */
    if(w.length>=2 && extra.length<=2) return true;                   /* «Мини чебуреки» ← «Мини чебуреки с курицей» */
    return extra.every(x=>['куриные','куриный','мини'].includes(x)); /* «Наггетсы» ← «Куриные наггетсы» */
  }); };
const INGR = DATA.cats.map(c=>c.dishes.map(d=>d.sost.map(x=>x.replace(/\.$/,'')).filter(x=>x && !/:\s*$/.test(x))));
/* в проверку попадают позиции, у которых есть состав (у пива, вина, крепкого алкоголя его нет) */

function category(ci, dishIdx){
  const c=DATA.cats[ci];
  /* бар: подзаголовки групп (Чай авторский, Кофе, Красное…) и сноски из барной книги */
  const notes=c.notes||[], groups=new Set(c.dishes.map(d=>d.g).filter(Boolean));
  const multi = c.sec==='b' && groups.size>1;
  const topNotes = notes.filter(n=>!n.g||!groups.has(n.g));
  let body='', prev=null;
  c.dishes.forEach((d,di)=>{
    if(multi && d.g!==prev){ prev=d.g; const gn=notes.filter(n=>n.g===d.g);
      body+=`<div class="grp"><h4>${esc(d.g)}</h4>${gn.map(n=>`<p>${esc(n.t)}</p>`).join('')}</div>`; }
    body+=dishCard(ci,d,di);
  });
  const tbl = c.table?`<details class="conv"><summary>${esc(c.table.title)}</summary><div class="conv-g">${c.table.rows.map(([a,b])=>`<span>${esc(a)}</span><b>${esc(b)}</b>`).join('')}</div></details>`:'';
  app.innerHTML = `<header class="bar" id="hdr"><div class="bar-in">${backBtn(SECID[c.sec])}${homeBtn()}<button class="picker" id="picker" aria-haspopup="listbox" aria-expanded="false" aria-label="Выбрать раздел"><span>${esc(c.name)}</span>${ICON.down}</button><span class="count">${cnt(c.sec,c.dishes.length)}</span></div>
    <nav class="strip" id="strip" aria-label="Позиции раздела">${c.dishes.map((d,di)=>`<button class="sd" data-jump="${di}" aria-current="${di===(dishIdx??0)}">${esc(d.name)}</button>`).join('')}</nav></header>
    <div class="scroll" id="sc"><div class="wrap">${c.note?`<div class="note">${esc(c.note)}</div>`:''}${topNotes.map(n=>`<div class="note">${esc(n.t)}</div>`).join('')}${tbl}
    <div class="dishes${c.sec==='b'?' bd':''}">${body}</div></div></div>`;
  app.dataset.ci = ci;
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>{
    const vis = es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
    if(vis) markStrip(+vis.target.dataset.i);
  },{root:document.getElementById('sc'),rootMargin:'-35% 0px -55% 0px'});
  document.querySelectorAll('.dish').forEach(el=>io.observe(el));
  if(dishIdx!=null) requestAnimationFrame(()=>jump(dishIdx,false)); else toTop();
}
function markStrip(i){
  const strip=document.getElementById('strip'); if(!strip) return;
  strip.querySelectorAll('.sd').forEach(b=>b.setAttribute('aria-current', String(+b.dataset.jump===i)));
  const b=strip.querySelector(`[data-jump="${i}"]`);
  if(b) strip.scrollLeft = b.offsetLeft - strip.clientWidth/2 + b.offsetWidth/2;
}
function jump(i, smooth=true){
  const el=document.getElementById('d-'+i), h=document.getElementById('hdr');
  if(!el) return;
  const sc=document.getElementById('sc');
  const top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 10;
  sc.scrollTo({top, behavior: smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth':'auto'});
  markStrip(i);
}

/* ---------- quiz ---------- */
const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/[«»"“”().,]/g,' ').replace(/\b(сыр|соус|свежие|свежий|свежая)\b/g,' ').replace(/\s+/g,' ').trim();
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const POOL = (()=>{ const m=new Map(); DATA.cats.forEach((c,ci)=>c.dishes.forEach((d,di)=>INGR[ci][di].forEach(s=>{ const n=norm(s); if(!n) return; const k=c.sec+'|'+n; if(!m.has(k)) m.set(k,{n,sec:c.sec,label:s,cats:new Set()}); m.get(k).cats.add(ci); }))); return [...m.values()].map(v=>({...v,isName:v.sec==='k'&&isDishName(v.label)})); })();
let Q=null, T=null, QS='k';
function buildQ(ci,di){
  const sec=DATA.cats[ci].sec, seen=new Set(); const correct=[];
  INGR[ci][di].forEach(s=>{const n=norm(s); if(!seen.has(n)){seen.add(n); correct.push({n,label:s,ok:true});}});
  const clash = n => correct.some(c=>c.n===n || (c.n.length>3&&n.includes(c.n)) || (n.length>3&&c.n.includes(n)));
  /* названия блюд среди вариантов — только у блюд кухни, в составе которых есть другие блюда */
  const hasNames = sec==='k' && INGR[ci][di].some(isDishName);
  const cand = shuffle(POOL.filter(p=>p.sec===sec && !clash(p.n) && (hasNames || !p.isName)));
  if(hasNames) cand.sort((a,b)=>(b.isName?1:0)-(a.isName?1:0) || Math.random()-.5);
  const want = Math.min(Math.max(5, correct.length), 12);
  const same = cand.filter(p=>p.cats.has(ci)), other = cand.filter(p=>!p.cats.has(ci));
  const wrong = [...same.slice(0,Math.ceil(want*0.6)), ...other].slice(0,want).map(p=>({n:p.n,label:p.label,ok:false}));
  return {ci,di,opts:shuffle([...correct,...wrong]),sel:new Set(),checked:false,win:false,note:''};
}
function checkLabel(n,need){
  if(n===need) return 'Проверить';
  if(n<need) return `Выбрано ${n} из ${need}`;
  return `Выбрано ${n} из ${need} — убери лишние`;
}

    ${skip.length?`<div class="note">${skip.map(ci=>'«'+esc(DATA.cats[ci].name)+'»').join(', ')} — в проверку не входят: в барной книге у этих позиций нет состава.</div>`:''}
    <div class="q-actions" style="margin-top:16px"><button class="btn ghost" data-quiz="${QS==='k'?'b':'k'}">Проверь себя ${SECS[QS==='k'?'b':'k'].name.toLowerCase()}</button></div>

function startRun(ci, list){
  const order = shuffle((list||QI(ci)).slice());
  QS = DATA.cats[ci].sec;
  T={ci,order,pos:0,results:[]};
  Q=buildQ(ci,order[0]); renderQuiz(); toTop();

/* 3. вопрос */
function renderQuiz(){
  const {ci,di,opts,sel,checked,win}=Q, c=DATA.cats[ci], d=c.dishes[di], s=SECS[c.sec];
  const need=opts.filter(o=>o.ok).length, N=T.order.length, last=T.pos===N-1;
  const flag = checked ? (win ? `<span class="ph-flag ok" role="status">${ICON.check}Отлично, всё верно!</span>` : `<span class="ph-flag bad" role="status">${ICON.x}Проверь ошибки</span>`) : '';
  const ph = d.img!=null ? `<button class="ph" data-zoom="${ci}:${di}" aria-label="Открыть фото"><img src="${img(d.img)}" alt="${esc(d.name)}">${flag}<span class="zoom">${ICON.zoom}</span></button>` : `<div class="ph none">${flag}${c.sec==='b'?'Без фото':'Фото будет позже'}</div>`;
  const optHtml = opts.map((o,i)=>{
    let cls='opt', pressed=sel.has(i);
    if(checked){ if(o.ok&&pressed) cls+=' ok'; else if(o.ok) cls+=' miss'; else if(pressed) cls+=' wrong'; else cls+=' off'; }
    return `<button class="${cls}" data-opt="${i}" aria-pressed="${!checked&&pressed}" ${checked?'disabled':''}>${esc(o.label)}</button>`;
  }).join('');
  const nextBtn = `<button class="btn" data-qa="next">${last?'Посмотреть результат':s.next} ${ICON.next}</button>`;
  let foot;
  if(!checked) foot = `<div class="q-actions"><button class="btn" data-qa="check" ${sel.size===need?'':'disabled style="opacity:.5"'}><span id="qcnt">${checkLabel(sel.size,need)}</span></button></div>`;
  else if(win) foot = `<div class="verdict ok"><b>Отлично, всё верно!</b>Все ингредиенты выбраны без ошибок.</div><div class="q-actions">${nextBtn}</div>`;
  else foot = `<div class="verdict bad"><b>Проверь ошибки</b>Красным — лишнее, зелёной пунктирной рамкой — что пропущено.</div>
    <div class="legend"><span><i style="background:var(--ok)"></i>верно</span><span><i style="border:1.5px dashed var(--ok)"></i>пропущено</span><span><i style="background:var(--accent)"></i>лишнее</span></div>
    <div class="q-actions">${nextBtn}</div>`;
  const meta = d.vy||d.v||'';
  app.innerHTML = simpleBar('Проверь себя · '+c.name, `${T.pos+1} из ${N}`, 'qa:pick') + `<div class="runbar"><i style="width:${Math.round((T.pos+(checked?1:0))/N*100)}%"></i></div><div class="scroll" id="sc"><div class="wrap"><div class="quiz${c.sec==='b'?' bq':''}${checked?(win?' res-ok':' res-bad'):''}">${ph}<div class="q-body">
    <div class="q-score"><span>${s.one} ${T.pos+1} из ${N}</span><span>${esc(meta)}</span></div>
    <p class="q-ask">${esc(d.name)}</p>
    <p class="q-meta">Выбери все ингредиенты ${s.gen} — их ${need}.</p>
    <div class="opts ${checked?'done':''}">${optHtml}</div>
    ${foot}
    <button class="report" data-qa="report">${ICON.flag}Сообщить об ошибке</button></div></div></div></div>`;
}
/* 4. итог */
function renderResults(){
  const c=DATA.cats[T.ci], s=SECS[c.sec], R=T.results, good=R.filter(r=>r.ok), bad=R.filter(r=>!r.ok), N=R.length;
  const thumb = di => thumbOf(c.dishes[di]);
  const list = arr => arr.length?`<div>${arr.map(x=>`<span class="rl ${x.cls}">${esc(x.t)}</span>`).join('')}</div>`:'';
  app.innerHTML = simpleBar('Результат · '+c.name,'','qa:pick') + `<div class="scroll" id="sc"><div class="wrap">
    <div class="res-sum ${bad.length?'':'all'}"><span>Раздел «${esc(c.name)}»</span><b>${good.length} из ${N}</b><em>${bad.length?`без ошибок · ${cnt(c.sec,bad.length)} с ошибками`:`Все ${s.acc} без ошибок!`}</em></div>
    ${bad.length?`<div class="sec-title">С ошибками · ${bad.length}</div><div class="res-list">${bad.map(r=>{ const d=c.dishes[r.di];
      return `<div class="res-item bad"><div class="ri-head">${thumb(r.di)}<b>${esc(d.name)}</b></div>
        ${r.missed.length?`<div class="ri-row"><span class="ri-lab miss">Пропущено</span>${list(r.missed.map(t=>({t,cls:'miss'})))}</div>`:''}
        ${r.extra.length?`<div class="ri-row"><span class="ri-lab wrong">Лишнее</span>${list(r.extra.map(t=>({t,cls:'wrong'})))}</div>`:''}
        <div class="ri-row"><span class="ri-lab">Правильный состав</span><div class="ri-sost">${esc(INGR[T.ci][r.di].join(', '))}</div></div></div>`;}).join('')}</div>`:''}
    ${good.length?`<div class="sec-title">Без ошибок · ${good.length}</div><div class="res-list">${good.map(r=>`<div class="res-item ok"><div class="ri-head">${thumb(r.di)}<b>${esc(c.dishes[r.di].name)}</b><span class="passed">${ICON.check}Верно</span></div></div>`).join('')}</div>`:''}
    <div class="q-actions" style="margin-top:18px">${bad.length?`<button class="btn" data-qa="redo">Повторить ${s.acc} с ошибками</button>`:''}<button class="btn ${bad.length?'ghost':''}" data-qa="again">Пройти раздел заново</button><button class="btn ghost" data-qa="pick">Другой раздел</button></div>
  </div></div>`;
  toTop();
}
let GN='';
function openReport(gen){
  if(gen){ const box={note:GN}; return reportDlg('', box, v=>{GN=v;}); }
  const c=DATA.cats[Q.ci], d=c.dishes[Q.di];

    <p class="dlg-big">Напиши, что не так, сделай скриншот и отправь менеджеру</p>
    <div class="dlg-dish">${d.img!=null?`<img src="${img(d.img)}" alt="">`:''}<div><span>${secOf(Q.ci).one}</span><b>${esc(d.name)}</b><small>${SECS[c.sec].name} · ${esc(c.name)}</small></div></div>
    <label class="dlg-lab" for="rep-text">Напиши текст: что не так?</label>
    <textarea id="rep-text" rows="4" maxlength="400" placeholder="${c.sec==='b'?'Например: в составе нет сиропа маракуйя, а тест считает его правильным':'Например: в составе нет огурца, а тест считает его правильным'}"></textarea>
  </div>`;
  showDlg(m, Q.note||'', v=>{ Q.note=v; });
}
function reportDlg(_, box, save){

  m.innerHTML=`<div class="dlg">

    <p class="dlg-big">Напиши, что не так или что предложить, сделай скриншот и отправь менеджеру</p>

ta.addEventListener('input',()=>save(ta.value));

sendBtn.type = 'button';
sendBtn.textContent = 'ОТПРАВИТЬ СООБЩЕНИЕ';

function sendFoodbookReport(message, section) {
  const url = 'https://script.google.com/macros/s/AKfycbxVh0v4iFzZ_WJkHvUgEAiio_BBClD-CKS9mezuNtHt2SK1Jkx-Egzwa7omiQ-N8rii/exec';

  if (!message.trim()) return;

  fetch(url, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify({
      message: message,
      section: section || 'Главная'
    })
  }).catch(error => console.error('Ошибка отправки:', error));
}

function quizAction(a, el){
  if(a==='pick') return route('quiz-'+QS);
  if(a==='start') return startRun(+el.dataset.ci);
  if(a==='again') return startRun(T.ci);
  if(a==='redo') return startRun(T.ci, T.results.filter(r=>!r.ok).map(r=>r.di));
  if(a==='report-gen') return openReport(true);
  if(a==='report') return openReport();
  if(!Q||!T) return;
  if(a==='check'){
    const need=Q.opts.filter(o=>o.ok).length; if(Q.sel.size!==need) return;
    const okIdx=Q.opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0);
    Q.win = okIdx.every(i=>Q.sel.has(i)); Q.checked=true;
    T.results.push({di:Q.di, ok:Q.win,
      missed:Q.opts.filter((o,i)=>o.ok&&!Q.sel.has(i)).map(o=>o.label),
      extra:Q.opts.filter((o,i)=>!o.ok&&Q.sel.has(i)).map(o=>o.label)});
    renderQuiz();
  } else if(a==='next'){
    T.pos++;
    if(T.pos>=T.order.length) return renderResults();
    Q=buildQ(T.ci,T.order[T.pos]); renderQuiz(); toTop();
  }
}

/* ---------- lightbox ---------- */
function lightbox(ci,di){
  const d=DATA.cats[ci].dishes[di];
  const lb=document.createElement('div'); lb.className='lb'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-label','Фото блюда');
  lb.innerHTML=`<div class="lb-top"><b>${esc(d.name)}</b><button class="lb-x" aria-label="Закрыть">${ICON.x}</button></div><div class="lb-img"><img src="${img(d.img)}" alt="${esc(d.name)}"></div><div class="lb-cap">${esc([d.vy||d.v,d.t||d.a].filter(Boolean).join(' · '))}</div>`;
  const close=()=>{lb.remove();document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape')close();};
  lb.addEventListener('click',e=>{ if(e.target.closest('.lb-x')||e.target.classList.contains('lb-img')||e.target===lb) close(); });
  document.addEventListener('keydown',onKey);
  document.body.appendChild(lb); lb.querySelector('.lb-x').focus();
}

/* ---------- routing ---------- */
let fromPop=false;
function setHash(h){ if(fromPop) return; const cur=(location.hash||'').slice(1); if(cur===h) return;
  try{ history.pushState(null,'',h?'#'+h:location.pathname+location.search); }catch(e){} }
window.addEventListener('popstate',()=>{ fromPop=true; try{ route((location.hash||'').slice(1)); } finally { fromPop=false; } });
function route(target, dish){
  if(io){ io.disconnect(); io=null; }
  if(target==='quiz') target='quiz-k';
  if(target==='quiz-k'||target==='quiz-b'){ setHash(target); return quizPick(target.slice(-1)); }
  if(target==='kitchen'||target==='bar'){ setHash(target); return section(target==='bar'?'b':'k'); }
  if(target==='sauces'){ setHash('sauces'); return sauces(); }
  if(target==='words'){ setHash('words'); return words(); }
  const ci=DATA.cats.findIndex(c=>c.id===target);
  if(ci>=0){ setHash(target); return category(ci, dish); }
  setHash(''); home(); toTop();
}
document.addEventListener('click',e=>{
  const z=e.target.closest('[data-zoom]'); if(z){ const [ci,di]=z.dataset.zoom.split(':').map(Number); return lightbox(ci,di); }
  if(e.target.closest('#picker')) return openMenu();
  const j=e.target.closest('[data-jump]'); if(j) return jump(+j.dataset.jump);
  const o=e.target.closest('[data-opt]'); if(o&&Q&&!Q.checked){ const i=+o.dataset.opt; Q.sel.has(i)?Q.sel.delete(i):Q.sel.add(i);
    o.setAttribute('aria-pressed', String(Q.sel.has(i))); const cb=document.querySelector('[data-qa="check"]'); if(cb){ const need=Q.opts.filter(x=>x.ok).length, ready=Q.sel.size===need; cb.disabled=!ready; cb.style.opacity=ready?'':'.5'; cb.innerHTML=`<span id="qcnt">${checkLabel(Q.sel.size,need)}</span>`; } return; }
  const qc=e.target.closest('[data-qcat]'); if(qc) return quizIntro(+qc.dataset.qcat);
  const qa=e.target.closest('[data-qa]'); if(qa) return quizAction(qa.dataset.qa, qa);
  const qz=e.target.closest('[data-quiz]'); if(qz) return route('quiz-'+qz.dataset.quiz);
  const g=e.target.closest('[data-go]'); if(g) route(g.dataset.go, g.dataset.dish!=null?+g.dataset.dish:null);
});
route((location.hash||'').slice(1));
